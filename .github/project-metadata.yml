# ai-coding-ok: v2.2.0
# codex-switch-server — 项目元信息
# 此文件为机器可读的项目元信息，供 CI/CD、Agent 和工具使用

project:
  name: "codex-switch-server"
  description: "Codex Switch 的配套服务端。提供版本更新镜像下载（解决国内用户访问 GitHub 困难）、Claude Desktop/Codex Desktop 安装包下载、Node.js/Git 等 CLI 依赖包下载、运营后台和体验提升计划数据收集。"
  version: "0.1.0"
  stage: "development"  # development / staging / production
  created: "2026-06-05"
  user_scale: "数百到数千（codex-switch 用户群体）"
  design_principle: "极简实用，维护优先 — 一个人维护，一切都是为了简单可靠"

tech_stack:
  language: "Python"
  language_version: "3.12"
  backend_framework: "FastAPI"
  frontend: "Jinja2 模板 + 极简 CSS（服务器渲染，无需前端构建工具）"
  orm: "SQLAlchemy 2.0 (async)"
  database: "SQLite"
  database_driver: "aiosqlite"
  test_framework: "pytest + pytest-asyncio"
  config: ".env 文件 + pydantic-settings"
  package_manager: "uv"

code_quality:
  formatter: "ruff"
  linter: "ruff"
  type_checker: "mypy（可选）"
  test_framework: "pytest + pytest-asyncio"
  min_coverage: 80

commands:
  install: "uv sync"
  dev: "uv run uvicorn src.main:app --reload"
  test: "uv run pytest"
  test_coverage: "uv run pytest --cov=src --cov-report=term"
  lint: "uv run ruff check ."
  format: "uv run ruff format ."

structure:
  source_dir: "src"
  test_dir: "tests"
  docs_dir: "docs"
  scripts_dir: "scripts"

conventions:
  commit_format: "conventional-commits"
  branch_strategy: "github-flow"
  code_review: "recommended"

