server {
    listen 80;
    server_name www.codexswtich.cloud codexswtich.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.codexswtich.cloud codexswtich.cloud;
    charset utf-8;

    ssl_certificate     /etc/nginx/ssl/codexswtich.cloud_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/codexswtich.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 512M;

    # ─────────── 搬家过渡期配置 ───────────

    # 搬家页（nginx 直接 serve，不 proxy 到 uvicorn）
    location = /moving.html {
        root /app/src/static;
    }

    # 门户三页面 → 全部返回搬家页（5s 后自动跳转到广州新站）
    location = / {
        rewrite ^ /moving.html break;
    }
    location = /download {
        rewrite ^ /moving.html break;
    }
    location = /guide {
        rewrite ^ /moving.html break;
    }

    # API 请求 → 反向代理到广州新主站
    # 旧版客户端（< v1.13）无感知切换，新版客户端直连广州
    location /api/v1/ {
        proxy_pass https://codex-switch.cloud;
        proxy_set_header Host codex-switch.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        # 大文件下载同样走反代
        proxy_buffering off;
    }

    # Admin → 重定向到广州
    location /admin {
        return 301 https://codex-switch.cloud/admin;
    }

    # ─────────── 以下保持原有配置（过渡期仍可用）───────────

    location /static/ {
        alias /app/src/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Internal: nginx serves cached files directly via sendfile (zero-copy)
    location /_cache/ {
        internal;
        alias /app/data/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
