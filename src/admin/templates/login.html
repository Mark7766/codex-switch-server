<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Switch — 管理员登录</title>
  <link rel="stylesheet" href="/static/css/apple.css">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { background:#fff; border-radius:var(--radius-lg); padding:var(--space-5); width:100%; max-width:380px; box-shadow:var(--shadow-card); }
    .login-box h1 { font-size:var(--text-subsection); font-weight:600; text-align:center; margin-bottom:var(--space-3); }
    .login-box input { width:100%; padding:var(--space-2); border:1px solid var(--color-separator); border-radius:var(--radius-sm); font-size:var(--text-body); margin-bottom:var(--space-2); }
    .login-box button { width:100%; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Codex Switch 运营后台</h1>
    <form method="post" action="/admin/login">
      <input type="password" name="token" placeholder="管理员 Token" required autofocus>
      <button type="submit" class="btn btn--primary">登录</button>
    </form>
  </div>
  {% include '_footer.html' %}
</body>
</html>
