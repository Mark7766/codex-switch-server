<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:site_name" content="Codex Switch">
  <meta property="og:title" content="Codex Switch — 让 AI 编程触手可及">

  <meta property="og:image" content="https://www.codexswtich.cloud/static/images/logo.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">

  <link rel="icon" type="image/png" href="/static/images/logo.png">
  <link rel="stylesheet" href="/static/css/apple.css?v=20260607c">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav" id="nav">
    <div class="nav__inner">

      <ul class="nav__links" id="navLinks">
        <li><a href="/download" class="nav__link" data-track="nav-download">下载</a></li>
        <li><a href="/guide" class="nav__link" data-track="nav-guide">指南</a></li>
        <li><a href="https://github.com/Mark7766/codex-switch" class="nav__link" data-track="nav-github" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
      <button class="nav__toggle" id="navToggle" aria-label="菜单">&#9776;</button>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div>
        <strong>Codex Switch</strong>
        <p class="footer__brand-desc">让 AI 编程触手可及</p>
      </div>
      <div class="footer__links">
        <div>
          <div class="footer__col-title">产品</div>
          <ul class="footer__col">
            <li><a href="/download">下载</a></li>
            <li><a href="/guide">使用指南</a></li>
          </ul>
        </div>
        <div>

            <li><a href="https://github.com/Mark7766/codex-switch" target="_blank" rel="noopener" data-track="footer-github">GitHub</a></li>
            <li><a href="https://github.com/Mark7766/codex-switch/issues" target="_blank" rel="noopener">反馈</a></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="footer__bottom content-width">
      <span>&copy; 2026 Codex Switch</span>
      <span>开源软件 · MIT License</span>
    </div>
  </footer>

  <script src="/static/js/portal.js?v=20260607b"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
