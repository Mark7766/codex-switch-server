services:
  app:
    build: .
    container_name: codex-switch-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
      - ./data:/app/data
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
